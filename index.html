<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💌</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  
  <!-- Die Navigations-Leiste (Jetzt mit 4 Reitern) -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('letters')">💌 Letters</button>
    <button class="nav-btn" onclick="switchTab('myday')">☀️ My Day</button>
    <button class="nav-btn" onclick="switchTab('secrets')">✨ For You</button>
    <button class="nav-btn" onclick="switchTab('us')">📸 Us</button>
  </div>

  <!-- SEITE 1: Die Briefe -->
  <div id="page-letters" class="page active">
    <h1>for you 💌</h1>
    <p class="subtitle">a few letters from me</p>
    <div class="envelopes" id="envelopes"></div>
  </div>

  <!-- SEITE 2: My Day (Übersicht der Tage) -->
  <div id="page-myday" class="page">
    <h1>my day ☀️</h1>
    <p class="subtitle">click on a day to see our moments</p>
    <div class="days-list" id="daysList"></div>
  </div>

  <!-- SEITE 3: For You (Die Herzen) -->
  <div id="page-secrets" class="page">
    <h1>little secrets 🩵</h1>
    <p class="subtitle">tap the pile to reveal something</p>
    <div class="hearts-container" id="heartsContainer"></div>
    <div id="openedSecretsSection" style="display: none; margin-top: 40px;">
      <h2 class="opened-title">opened secrets</h2>
      <div class="opened-list" id="openedList"></div>
    </div>
  </div>

  <!-- SEITE 4: Us (Die Pinnwand) -->
  <div id="page-us" class="page">
    <h1>us 📸</h1>
    <p class="subtitle">our little moments</p>
    <div class="pinboard-container">
      <!-- Die Lichterkette -->
      <div class="string-lights"></div>
      
      <!-- Die Pinnwand -->
      <div class="pinboard" id="pinboard">
        <!-- Bilder werden hier per JS eingefügt -->
      </div>
    </div>
  </div>

  <!-- Das Overlay für die Briefe -->
  <div class="letter-view" id="letterView">
    <div class="letter-card">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2 id="letterTitle"></h2>
      <div class="letter-media" id="letterMedia"></div>
      <div class="letter-body" id="letterBody"></div>
      <div class="signature">— me 💙</div>
    </div>
  </div>

  <!-- Das Overlay für die My Day Details -->
  <div class="letter-view" id="dayView">
    <div class="letter-card day-detail-card">
      <button class="close-btn" id="closeDayBtn">✕</button>
      <h2 id="dayDetailDate"></h2>
      <div class="day-detail-content" id="dayDetailContent"></div>
    </div>
  </div>

  <!-- Das Overlay für die Herzen -->
  <div class="letter-view" id="secretView">
    <div class="letter-card secret-popup-card">
      <button class="close-btn" id="closeSecretBtn">✕</button>
      <div class="secret-media" id="secretMedia"></div>
      <div class="secret-body" id="secretBody"></div>
    </div>
  </div>

  <!-- NEU: Das Overlay für die großen Bilder (Pinnwand) -->
  <div class="letter-view" id="imageView">
    <div class="image-popup">
      <button class="close-btn" id="closeImageBtn">✕</button>
      <img id="enlargedImage" src="" alt="Us">
    </div>
  </div>

</div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tabName === 'letters') {
        document.getElementById('page-letters').classList.add('active');
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
      } else if (tabName === 'myday') {
        document.getElementById('page-myday').classList.add('active');
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
      } else if (tabName === 'secrets') {
        document.getElementById('page-secrets').classList.add('active');
        document.querySelectorAll('.nav-btn')[2].classList.add('active');
      } else if (tabName === 'us') {
        document.getElementById('page-us').classList.add('active');
        document.querySelectorAll('.nav-btn')[3].classList.add('active');
      }
    }
  </script>
</body>
</html>
